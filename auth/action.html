<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<!-- le lien contient un code à usage unique : il ne doit jamais partir en Referer -->
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0B0F0C">
<title>EZFOOT</title>
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png?v=3">
<style>
:root{--bg:#0B0F0C;--surface:#141A16;--ink:#F2F5F0;--muted:#8A968E;--line:#26302A;--pitch:#3DDC84;--pitch-ink:#06170D;--danger:#FF6B5E;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:max(32px,env(safe-area-inset-top)) 16px 32px}
main{max-width:440px;margin:0 auto}
.logo{display:block;margin:0 auto 28px;height:30px;width:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 20px}
h1{margin:0 0 10px;font-size:24px;line-height:1.2}
h1:focus{outline:0}
p{margin:0 0 16px}
.muted{color:var(--muted);font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:0 0 14px}
input{display:block;width:100%;margin-top:6px;min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input:focus{outline:0;border-color:var(--pitch);box-shadow:0 0 0 3px color-mix(in srgb,var(--pitch) 30%,transparent)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border:0;border-radius:12px;background:var(--pitch);color:var(--pitch-ink);font-family:inherit;font-size:17px;font-weight:700;line-height:1;text-decoration:none;cursor:pointer}
.btn[disabled]{opacity:.6;cursor:default}
:focus-visible{outline:3px solid var(--pitch);outline-offset:2px}
.msg{min-height:1.5em;margin:0 0 12px;font-size:14px}
.err{color:var(--danger)}
</style>
</head>
<body>
<main>
  <img class="logo" src="../logo-texte.png" srcset="../logo-texte@2x.png 2x" alt="EZFOOT" width="130" height="30">
  <div class="card" id="card" aria-live="polite"><p class="muted" id="loading"></p></div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,verifyPasswordResetCode,confirmPasswordReset,applyActionCode} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app=initializeApp({
  apiKey:"AIzaSyDvKm4HJTHt2XD8MaUx9pqrrQj454X6lM8",
  authDomain:"foot5-68b18.firebaseapp.com",
  projectId:"foot5-68b18",
  appId:"1:123694775975:web:a17eb484f7b57e37eba582"
});
const auth=getAuth(app);

const q=new URLSearchParams(location.search);
const mode=q.get('mode')||'',code=q.get('oobCode')||'';
const LANG=q.get('lang')==='en'||(!q.get('lang')&&/^en/i.test(navigator.language||''))?'en':'fr';
document.documentElement.lang=LANG;
// le code reste en mémoire, il disparaît de la barre d'adresse et de l'historique
history.replaceState(null,'',location.pathname+'?lang='+LANG);

const T={
  fr:{loading:'Vérification du lien…',open:'Ouvrir EZFOOT',
    resetTitle:'Nouveau mot de passe',resetFor:'Pour le compte',pw:'Nouveau mot de passe',pw2:'Confirmer le mot de passe',save:'Enregistrer',
    tooShort:'6 caractères minimum.',mismatch:'Les mots de passe ne correspondent pas.',weak:'Mot de passe trop faible.',
    resetDone:'Mot de passe modifié',resetDoneTxt:'Tu peux maintenant te connecter avec ton nouveau mot de passe.',
    verifyDone:'Adresse confirmée',verifyDoneTxt:'Merci, ton adresse e-mail est confirmée.',
    changeDone:'Adresse modifiée',changeDoneTxt:'Ta nouvelle adresse e-mail est enregistrée. Utilise-la pour te connecter.',
    expired:'Ce lien a expiré',invalid:'Ce lien n’est plus valable',
    againReset:'Demande un nouveau lien depuis « Mot de passe oublié ? » dans EZFOOT.',againVerify:'Ouvre EZFOOT pour recevoir un nouvel e-mail.',
    usedTxt:'Il a peut-être déjà été utilisé, ou il est incomplet.',network:'Connexion impossible. Vérifie ton réseau et réessaie.',
    unknown:'Lien incomplet',unknownTxt:'Ouvre le lien reçu par e-mail en entier.'},
  en:{loading:'Checking the link…',open:'Open EZFOOT',
    resetTitle:'New password',resetFor:'For the account',pw:'New password',pw2:'Confirm password',save:'Save',
    tooShort:'At least 6 characters.',mismatch:'Passwords don’t match.',weak:'Password too weak.',
    resetDone:'Password changed',resetDoneTxt:'You can now sign in with your new password.',
    verifyDone:'Address confirmed',verifyDoneTxt:'Thanks, your email address is confirmed.',
    changeDone:'Address changed',changeDoneTxt:'Your new email address is saved. Use it to sign in.',
    expired:'This link has expired',invalid:'This link is no longer valid',
    againReset:'Request a new link from “Forgot password?” in EZFOOT.',againVerify:'Open EZFOOT to get a new email.',
    usedTxt:'It may have been used already, or it is incomplete.',network:'Can’t connect. Check your network and try again.',
    unknown:'Incomplete link',unknownTxt:'Open the full link from the email.'}
}[LANG];

const $c=document.getElementById('card');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const openBtn=`<a class="btn" href="/">${T.open}</a>`;
const show=(title,text)=>{$c.innerHTML=`<h1 tabindex="-1">${esc(title)}</h1><p>${esc(text)}</p>${openBtn}`;$c.querySelector('h1').focus()};
const mask=e=>{const [u,d]=e.split('@');return (u[0]||'')+'•••@'+d};
function fail(e,again){
  const c=e&&e.code||'';
  if(c==='auth/network-request-failed')return show(T.invalid,T.network);
  if(c==='auth/expired-action-code')return show(T.expired,again);
  show(T.invalid,T.usedTxt+' '+again);
}

document.getElementById('loading').textContent=T.loading;

if(!code||!['resetPassword','verifyEmail','verifyAndChangeEmail'].includes(mode))show(T.unknown,T.unknownTxt);
else if(mode==='resetPassword'){
  try{
    const email=await verifyPasswordResetCode(auth,code);
    $c.innerHTML=`<h1>${T.resetTitle}</h1><p class="muted">${T.resetFor} <b>${esc(mask(email))}</b></p>
      <form id="f" novalidate><label>${T.pw}<input id="p1" type="password" autocomplete="new-password" minlength="6" required></label>
      <label>${T.pw2}<input id="p2" type="password" autocomplete="new-password" minlength="6" required></label>
      <p class="msg err" id="m" role="alert"></p><button class="btn" id="s">${T.save}</button></form>`;
    const f=document.getElementById('f'),m=document.getElementById('m'),s=document.getElementById('s');
    document.getElementById('p1').focus();
    f.addEventListener('submit',async ev=>{
      ev.preventDefault();m.textContent='';
      const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;
      if(p1.length<6){m.textContent=T.tooShort;return}
      if(p1!==p2){m.textContent=T.mismatch;return}
      s.disabled=true;
      try{await confirmPasswordReset(auth,code,p1);show(T.resetDone,T.resetDoneTxt)}
      catch(e){if(e&&e.code==='auth/weak-password'){m.textContent=T.weak;s.disabled=false}else fail(e,T.againReset)}
    });
  }catch(e){fail(e,T.againReset)}
}else{
  try{await applyActionCode(auth,code);mode==='verifyEmail'?show(T.verifyDone,T.verifyDoneTxt):show(T.changeDone,T.changeDoneTxt)}
  catch(e){fail(e,T.againVerify)}
}
</script>
</body>
</html>
