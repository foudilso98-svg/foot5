<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EZFOOT</title>
<link rel="manifest" href="manifest.webmanifest?v=3">
<meta name="theme-color" content="#0B0F0C">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EZFOOT">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F7;--surface:#FFFFFF;--ink:#1C1C1E;--muted:#8A8A8E;--line:rgba(60,60,67,.13);
  --pitch:#28A745;--pitch-ink:#FFFFFF;--a:#FF9500;--b:#007AFF;--gold:#C98A00;--gold-bg:#FFF8E1;--danger:#FF3B30;--tint:rgba(118,118,128,.12);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--surface:#1C1C1E;--ink:#F2F2F7;--muted:#98989F;--line:rgba(84,84,88,.55);--tint:rgba(118,118,128,.24);
    --pitch:#30D158;--pitch-ink:#FFFFFF;--a:#FF9F0A;--b:#0A84FF;--gold:#FFD60A;--gold-bg:#2A2410;--danger:#FF453A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--surface:#1C1C1E;--ink:#F2F2F7;--muted:#98989F;--line:rgba(84,84,88,.55);--tint:rgba(118,118,128,.24);
  --pitch:#30D158;--pitch-ink:#FFFFFF;--a:#FF9F0A;--b:#0A84FF;--gold:#FFD60A;--gold-bg:#2A2410;--danger:#FF453A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:transparent;color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0A7A39}
.cond{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji"}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}

/* Tableau d'affichage */
.top{color:#fff;padding:12px 16px 20px;text-shadow:0 1px 2px rgba(0,0,0,.35);border-bottom:4px solid #fff;
  background-color:#0A7A39;
  background-image:
    radial-gradient(circle at 50% 50%,transparent 58px,rgba(255,255,255,.4) 59px,rgba(255,255,255,.4) 61px,transparent 62px),
    linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.4) calc(50% - 1px),rgba(255,255,255,.4) calc(50% + 1px),transparent calc(50% + 1px)),
    repeating-linear-gradient(90deg,#0A7A39 0 44px,#0F9446 44px 88px)}
.wrap{max-width:560px;margin:0 auto}
.brand{font:600 15px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";letter-spacing:.02em;opacity:.85}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:10px}
.board .tn{font:600 20px/1.1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";overflow-wrap:anywhere}
.board .tn.r{text-align:right}
.board .tn::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:1px}
.board .tn.A::before{background:var(--a)}
.board .tn.B::before{background:var(--b)}
.board .sc{font:700 46px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";font-variant-numeric:tabular-nums;background:#07140C;color:#FFE14D;text-shadow:0 0 12px rgba(255,225,77,.45);box-shadow:inset 0 0 0 2px rgba(255,255,255,.15);padding:4px 14px 6px;border-radius:6px;min-width:120px;text-align:center}
.board-sub{text-align:center;font-size:14px;margin-top:8px;opacity:.9}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{display:flex;align-items:center;gap:8px;padding:14px 12px;border:1px solid var(--line);background:var(--bg);border-radius:8px;font:600 19px/1.1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";text-align:left;overflow-wrap:anywhere}
.pick button .ck{margin-left:auto;color:var(--pitch)}
.goals{list-style:none;margin:0 0 12px;padding:0}
.goals li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.goals li:first-child{border-top:0}
.goals li .g{flex:1;min-width:0;overflow-wrap:anywhere}
.gtally{font:700 30px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";text-align:center;margin-bottom:10px;font-variant-numeric:tabular-nums}
.gseg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.gseg .dot{width:14px;height:14px}
.gseg button{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:20px 10px;font:700 24px/1.1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";display:flex;align-items:center;justify-content:center;gap:6px;overflow-wrap:anywhere}
.gseg button.on.A{background:var(--a);border-color:var(--a);color:#fff}
.gseg button.on.B{background:var(--b);border-color:var(--b);color:#fff}
.gpick button{justify-content:center;text-align:center;font-size:17px;padding:12px 8px}
.gpick button.on{background:var(--pitch);border-color:var(--pitch);color:#fff}
.clockbig{font:700 64px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";text-align:center;font-variant-numeric:tabular-nums;margin:4px 0 12px}
.clockbig.run{color:var(--pitch)}
.chrono .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chrono .btn{margin:0}
.bchip{display:inline-block;background:#07140C;color:#FFE14D;font:700 18px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";padding:5px 10px;border-radius:999px;font-variant-numeric:tabular-nums;text-shadow:none}
.bchip.run::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#FF3B3B;margin-right:6px;vertical-align:1px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.bgs{position:fixed;inset:0;z-index:-2;overflow:hidden;background:var(--bg)}
.bgs div{position:absolute;inset:0;background-size:cover;background-position:center 25%;opacity:0;transition:opacity 1.6s ease}
.bgs div.on{opacity:1}
.bgs::after{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 72%,transparent)}
.empty{background:color-mix(in srgb,var(--surface) 85%,transparent);border-radius:10px}
.cmbtn{display:block;background:none;border:0;padding:4px 0 0;color:var(--muted);font-size:13px;font-weight:600}
.plink{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
.chips button.on{background:var(--pitch);border-color:var(--pitch);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpis div{background:var(--bg);border-radius:8px;padding:10px 6px;text-align:center}
.kpis b{display:block;font:700 26px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";font-variant-numeric:tabular-nums}
.kpis span{font-size:12px;color:var(--muted)}
.pname{font:700 40px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";margin:6px 0 4px;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:flex;align-items:center;gap:8px;background:var(--gold-bg);border:1px solid var(--gold);border-radius:10px;padding:8px 10px;font-weight:600;font-size:14px}
.badge i{font-style:normal;font-size:22px}
.mlog{list-style:none;margin:0;padding:0}
.mlog li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.mlog li:first-child{border-top:0}
.res{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;font:700 17px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";color:#fff}
.res.V{background:var(--pitch)}.res.N{background:#8A8F8C}.res.D{background:var(--danger)}
.photo{width:100%;border-radius:10px;display:block;margin-bottom:10px}
.upl{display:block;text-align:center;border:2px dashed var(--line);border-radius:10px;padding:14px;font-weight:600;cursor:pointer;margin-bottom:10px}
.upl input{display:none}
.range{position:relative;height:40px;margin:4px 6px 0}
.rtrack{position:absolute;left:0;right:0;top:17px;height:6px;border-radius:3px;background:var(--line)}
.rfill{position:absolute;top:0;bottom:0;background:var(--pitch);border-radius:3px}
.range input{position:absolute;left:-14px;width:calc(100% + 28px);top:0;height:40px;margin:0;padding:0;border:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.range input::-webkit-slider-runnable-track{background:none;height:40px}
.range input::-moz-range-track{background:none}
.range input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:28px;height:28px;margin-top:6px;border-radius:50%;background:#fff;border:3px solid var(--pitch);box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:grab}
.range input::-moz-range-thumb{pointer-events:auto;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--pitch);cursor:grab}
.rlab{display:flex;justify-content:space-between;font-weight:600;font-size:14px;margin:4px 0 12px}
.board-empty{font:600 26px/1.1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";margin-top:10px}

main{padding:14px 12px calc(84px + env(safe-area-inset-bottom,0px))}
h2{font:600 21px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 12px;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:14px}
.empty{text-align:center;padding:40px 12px;color:var(--muted)}
.btn{box-shadow:0 2px 0 rgba(0,0,0,.18);display:block;width:100%;font:700 19px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";padding:14px 16px;border-radius:8px;border:0;background:var(--pitch);color:var(--pitch-ink);margin-bottom:10px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.inline{display:inline-block;width:auto;padding:11px 16px;margin:0}
.link{background:none;border:0;padding:0;color:var(--b);text-decoration:underline}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
label.fld{display:block;font-size:14px;color:var(--muted);margin-bottom:10px}
label.fld input,label.fld select{margin-top:4px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addrow{display:flex;gap:8px;margin-bottom:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.dot.A{background:var(--a)}.dot.B{background:var(--b)}

/* Composition */
.counts{display:flex;gap:16px;font-size:14px;margin-bottom:8px;flex-wrap:wrap}
.counts b{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";font-size:17px}
.counts .ok{color:var(--pitch)}
.prow{display:flex;align-items:center;gap:6px;padding:7px 0;border-top:1px solid var(--line)}
.prow .pn{flex:1;min-width:0;overflow-wrap:anywhere}
.seg4{display:flex;gap:3px}
.seg4 button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 7px;font:600 14px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";min-width:30px}
.seg4 button.on.A,.seg4 button.on.sA{background:var(--a);border-color:var(--a);color:#fff}
.seg4 button.on.B,.seg4 button.on.sB{background:var(--b);border-color:var(--b);color:#fff}
.x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:4px 6px}
.lineup{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lineup h3{font:600 17px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";margin:0 0 6px;display:flex;align-items:center;gap:6px}
.lineup ul{list-style:none;margin:0;padding:0}
.lineup li{padding:3px 0;font-size:15px;overflow-wrap:anywhere}
.lineup li.sub{color:var(--muted)}
.lineup .ck{color:var(--pitch);font-weight:600}

/* Score + vainqueur */
.scorein{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end;margin-bottom:12px}
.scorein input{font:700 30px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";text-align:center;padding:8px}
.scorein span{font:700 28px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";padding-bottom:12px}
.seg{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 8px;font-weight:600;overflow-wrap:anywhere}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sorts{display:flex;gap:6px;margin-bottom:10px}
.sorts button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 6px;font-weight:600;font-size:15px}
.sorts button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Vote */
.who{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rrow .rhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rrow .rhead .nm{flex:1;font-weight:600}
.rrow .val{font:700 26px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
.rates{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-bottom:8px}
.rates button{height:38px;padding:0;border:1px solid var(--line);background:var(--bg);border-radius:6px;font:600 17px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji"}
.rates button.on{background:var(--pitch);border-color:var(--pitch);color:#fff}
.rates button.lit{background:color-mix(in srgb,var(--pitch) 18%,var(--bg))}
.cmt{font-size:15px;padding:8px 10px}
.savebar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));padding-top:6px;background:linear-gradient(transparent,var(--bg) 30%)}
.msg{font-size:15px;margin:0 0 10px;min-height:1px}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--pitch)}

/* Résultats */
.result{text-align:center}
.result .wl{font:600 22px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";margin-bottom:8px}
.result .sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.result .sb .tn{font:600 18px/1.1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";overflow-wrap:anywhere;display:flex;align-items:center;gap:6px;justify-content:center}
.result .sb .tn.win{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.result .score{font:700 52px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";font-variant-numeric:tabular-nums}
.motm{background:var(--gold-bg);border:2px solid var(--gold);text-align:center}
.motm .k{font-size:14px;color:var(--gold);font-weight:600}
.motm .n{font:700 34px/1.05 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";margin:4px 0;overflow-wrap:anywhere}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:28px 12px 1fr auto auto;gap:8px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rank .pos{font:700 20px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";color:var(--muted)}
.rank .dot{margin-top:6px}
.rank .nm{overflow-wrap:anywhere}
.rank .nm small{color:var(--muted)}
.rank .cm{display:block;font-size:13px;color:var(--muted);font-style:italic;margin-top:2px}
.rank .avg{font:700 22px/1.1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";font-variant-numeric:tabular-nums}
.rank .nv{font-size:13px;color:var(--muted);padding-top:4px;min-width:42px;text-align:right}
.rank li.is-motm .pos,.rank li.is-motm .avg{color:var(--gold)}

/* Stats */
.tbl{overflow-x:auto;margin:0 -12px;padding:0 12px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:8px 5px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{font:600 14px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";color:var(--muted);border-top:0}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:90px}
th .sth{background:none;border:0;padding:4px 2px;font:inherit;color:inherit;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
th .sth.on{color:var(--pitch)}
th .sth .ar{font-size:11px;opacity:.7}
th .sth.on .ar{opacity:1}
td.hl{color:var(--pitch)}
td.hl{font-weight:600}

/* Historique */
.hitem{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;display:block}
.hitem .d{font-size:13px;color:var(--muted)}
.hitem .l{display:flex;align-items:center;gap:8px;font:600 19px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";margin:4px 0;flex-wrap:wrap}
.hitem .l .w{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.hitem .s{font-variant-numeric:tabular-nums}
.hitem .ps{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.hitem .m{font-size:14px;margin-top:4px}

.odds button.on{border-color:var(--pitch);background:color-mix(in srgb,var(--pitch) 16%,var(--bg))}
.odds button:disabled{opacity:1}
.stakerow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stakerow .chips{margin:0}
.stakerow .stepper b{font-size:32px;min-width:56px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ===== Refonte visuelle : Stats & fiche joueur ===== */
:root{--disp:"Barlow Condensed","Inter",system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji"}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0F0C;--surface:#141A16;--ink:#F2F5F0;--muted:#8A968E;--line:#26302A;--tint:rgba(255,255,255,.07);
    --pitch:#3DDC84;--pitch-ink:#06170D;--a:#FF8A3D;--b:#4DA3FF;--gold:#F5C451;--gold-bg:#2A2412;--danger:#FF6B5E;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0F0C;--surface:#141A16;--ink:#F2F5F0;--muted:#8A968E;--line:#26302A;--tint:rgba(255,255,255,.07);
  --pitch:#3DDC84;--pitch-ink:#06170D;--a:#FF8A3D;--b:#4DA3FF;--gold:#F5C451;--gold-bg:#2A2412;--danger:#FF6B5E;
}
.rates button.on,.gpick button.on{color:var(--pitch-ink)}
.brand,.board .sc,.result .score,.gtally,.motm .n,.odds b,.odds button b,.stepper b,.h2h tbody td,.rrow .val{font-family:var(--disp);letter-spacing:0}
.brand{text-transform:uppercase;letter-spacing:.01em}
.board .sc{font-weight:800;font-size:64px}
/* En-tête Stats */
.sthead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 4px 12px}
.sthead h1{font:800 44px/1 var(--disp);text-transform:uppercase;margin:0;letter-spacing:0}
.sthead span{font-size:13px;color:var(--muted);padding-bottom:4px}
/* Classements à onglets */
.ttabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px}
.ttabs button{min-height:44px;border:1px solid var(--line);background:var(--tint);border-radius:12px;font-weight:600;font-size:13px;color:var(--ink);padding:0 4px}
.ttabs button.on{background:var(--pitch);border-color:var(--pitch);color:var(--pitch-ink);font-weight:700}
.ttabs button:active{transform:scale(.97)}
.leader{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--tint);position:relative;overflow:hidden;margin-bottom:4px}
.leader::after{content:"";position:absolute;right:-36px;top:-36px;width:140px;height:140px;border-radius:50%;border:2px solid var(--line);pointer-events:none}
.av0{width:60px;height:60px;border-radius:50%;flex:none;object-fit:cover;display:grid;place-items:center;background:var(--pitch);color:var(--pitch-ink);font:800 28px/1 var(--disp)}
.leader .lk{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.leader .ln{font:800 30px/1.05 var(--disp);text-transform:uppercase;overflow-wrap:anywhere}
.leader .ln .plink,.lrows .plink{text-decoration:none}
.leader .ls{font-size:12px;color:var(--muted)}
.leader .lv{margin-left:auto;text-align:right;font:800 50px/.9 var(--disp);color:var(--pitch);position:relative;z-index:1}
.leader .lv small{display:block;font:600 11px/1.6 Inter,system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.lrows{list-style:none;margin:0;padding:0}
.lrows li{display:grid;grid-template-columns:24px minmax(0,1fr) 60px;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.lrows li:first-child{border-top:0}
.lrows .pos{font:700 18px/1 var(--disp);color:var(--muted);text-align:center}
.lrows .nm{display:flex;flex-direction:column;gap:7px;min-width:0;font-weight:600;font-size:15px}
.lbar{height:4px;border-radius:2px;background:var(--tint);overflow:hidden}
.lbar i{display:block;height:100%;border-radius:2px;background:var(--pitch)}
.lrows .vv{text-align:right;font:700 24px/1 var(--disp);font-variant-numeric:tabular-nums}
/* Fiche joueur */
.phero{display:flex;align-items:center;gap:16px;margin:2px 0 16px}
.phero .av0{width:84px;height:84px;font-size:40px;border:3px solid var(--line)}
.phero .av0.au{border-color:var(--gold)}
.phero .pname{margin:2px 0 6px;font:800 44px/.95 var(--disp);text-transform:uppercase;letter-spacing:0}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchips span{min-height:24px;padding:2px 10px;border-radius:12px;background:var(--tint);font-size:12px;font-weight:600;display:inline-flex;align-items:center}
.pchips span.au{background:var(--gold-bg);color:var(--gold)}
.kpis div{padding:12px 4px}
.kpis b{font:800 30px/1 var(--disp);letter-spacing:0}
.kpis span{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.kpis div:nth-child(3){background:var(--pitch);color:var(--pitch-ink)}
.kpis div:nth-child(3) span{color:inherit;opacity:.85}
.botile{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--tint);border-radius:16px;padding:12px 16px;margin-top:12px}
.botile span{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.botile b{font:800 32px/1 var(--disp);color:var(--gold)}
.mlog .avg{font-family:var(--disp)!important}

/* ===== Thème « vert nuit » sur tout le site + UX ===== */
:root{--lnk:#0A7A39;--board:#0E3B22;--board-line:rgba(255,255,255,.16);--card-bd:var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lnk:#3DDC84;--board:#0F2A1A;--board-line:rgba(61,220,132,.16)}}
:root[data-theme="dark"]{--lnk:#3DDC84;--board:#0F2A1A;--board-line:rgba(61,220,132,.16)}
html{background:var(--bg)}
body{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--pitch);outline-offset:2px}
.bgs::after{background:color-mix(in srgb,var(--bg) 90%,transparent)}
/* En-tête */
.top{padding:16px 16px 6px}
.brand{font:800 32px/1 var(--disp);text-transform:uppercase;letter-spacing:.01em}
.brand .acc{color:var(--pitch)}
@media (max-width:430px){.brandrow .brand{font-size:28px}}
/* Tableau du match : pelouse sombre + lignes */
#board{border-radius:22px;background-color:var(--board);border:1px solid var(--board-line);box-shadow:none;
  background-image:radial-gradient(circle at 50% 50%,transparent 54px,var(--board-line) 55px,var(--board-line) 56px,transparent 57px),
  linear-gradient(90deg,transparent calc(50% - .5px),var(--board-line) calc(50% - .5px),var(--board-line) calc(50% + .5px),transparent calc(50% + .5px))}
#board .board-empty{font:800 26px/1.1 var(--disp);text-transform:uppercase;letter-spacing:.01em}
.board .tn{font-weight:700}
.board .sc{color:#fff}
.board-sub{opacity:.8}
.bchip{background:rgba(0,0,0,.35)}
.badd button,.bcol>button{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08)}
.badd button.on,.bcol>button.on{background:var(--pitch);color:var(--pitch-ink);border-color:var(--pitch)}
/* Cartes et titres */
.card,.hitem,.empty{border:1px solid var(--card-bd);background:color-mix(in srgb,var(--surface) 94%,transparent);box-shadow:none}
h2{font:800 21px/1.1 var(--disp);text-transform:uppercase;letter-spacing:.02em;margin:0 0 12px}
.mbox h2{font-size:26px}
.welcome h2{font-size:32px}
.muted,.small.muted{color:var(--muted)}
/* Boutons */
.btn{min-height:50px;border-radius:14px;font-weight:700;color:var(--pitch-ink)}
.btn.ghost{background:var(--tint);color:var(--ink);border:1px solid var(--line)}
.btn.danger{border:1px solid color-mix(in srgb,var(--danger) 35%,transparent)}
.btn.podbtn{background:var(--gold);color:#2A1F00;border:0}
.link,.cmbtn,.mbtn{color:var(--lnk)}
.cmbtn.bgtog{color:rgba(255,255,255,.85)}
.x{min-width:36px;min-height:36px;border-radius:10px;display:inline-grid;place-items:center}
.x:hover{background:var(--tint)}
/* Contrôles segmentés et puces */
.sorts button.on,.seg button.on{background:var(--ink);color:var(--bg);box-shadow:none}
.sorts button,.seg button{min-height:38px}
.chips button{min-height:36px}
.seg4 button{min-height:34px;min-width:34px}
.gseg button.on.A,.gseg button.on.B,.seg4 button.on.A,.seg4 button.on.sA,.seg4 button.on.B,.seg4 button.on.sB{color:#0B0F0C}
.gseg button.on.A,.gseg button.on.B{box-shadow:none}
.rates button{height:42px}
.rates button.on{box-shadow:none}
.odds button.on{border-color:var(--pitch);background:color-mix(in srgb,var(--pitch) 14%,var(--bg))}
/* Saisie */
input,select{border:1px solid transparent}
input:focus,select:focus{outline:0;border-color:var(--pitch);box-shadow:0 0 0 3px color-mix(in srgb,var(--pitch) 25%,transparent)}
/* Résultats, MOTM, badges */
.res{color:#fff}.res.V{color:var(--pitch-ink)}
.motm{background:var(--gold-bg);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);color:var(--ink);box-shadow:none}
.motm .k,.motm .muted{color:var(--gold)}
.motm .n{font-size:42px;text-transform:uppercase}
.badge{background:var(--gold-bg);border:1px solid color-mix(in srgb,var(--gold) 30%,transparent)}
.pnote{background:color-mix(in srgb,var(--pitch) 16%,transparent);color:var(--lnk)}
.result .score{font-weight:800;font-size:64px}
.rank .pos,.rank .avg{font-family:var(--disp);letter-spacing:0}
.rank .avg{font-size:24px}
.hitem .l{font:700 22px/1.15 var(--disp);text-transform:uppercase;letter-spacing:.01em}
.clockbig{font-variant-numeric:tabular-nums}
.nextc .n{font:800 26px/1.1 var(--disp);text-transform:uppercase}
.nextc .k .soon{color:var(--a)}
/* Barre d'onglets : pastille sous l'icône active */
.tabs{background:color-mix(in srgb,var(--surface) 88%,transparent);border-top:1px solid var(--line)}
.tabs button{min-height:58px;padding:8px 0 10px;gap:4px}
.tabs button svg{box-sizing:content-box;padding:3px 16px;border-radius:999px;transition:background .15s}
.tabs button.on svg{background:color-mix(in srgb,var(--pitch) 20%,transparent)}
.tabs button.on span{font-weight:700}
/* Fenêtres et toasts */
.mbox{border:1px solid var(--line)}
.modal{background:rgba(0,0,0,.55)}
.toast{background:var(--ink);color:var(--bg);font-weight:600}

/* Tableau réduit */
#board.none{display:none}
#board.mini{padding:0;margin-top:10px;border-radius:16px;background-image:none}
.bmini{display:flex;align-items:center;gap:8px;width:100%;min-height:50px;padding:8px 12px 8px 14px;border:0;background:none;color:#fff;font:600 14px/1.2 Inter,system-ui,sans-serif;text-align:left}
.bmini{gap:6px}
.bmini .bt{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bmini b{flex:none;white-space:nowrap;font:800 22px/1 var(--disp);font-variant-numeric:tabular-nums;margin:0 4px}
.bmini .dot{flex:none}
.bmini .bs{flex:none;margin-left:auto;padding-left:6px;font-size:11px;font-weight:600;opacity:.8;white-space:nowrap}
.bmini .bchip{font-size:12px;padding:4px 8px}
.bmini svg{flex:none;opacity:.7}
/* Icônes de boutons */
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;margin-right:.45em;flex:none}
h2 .ic{width:.95em;height:.95em;vertical-align:-.08em;color:var(--pitch)}
.brand .logo{display:block;width:44px;height:44px;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
@media (max-width:430px){.brand .logo{width:40px;height:40px;border-radius:11px}}

.pdrop{margin:12px 0 10px;border:1px solid var(--line);border-radius:12px;background:var(--tint)}
.pdrop>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px}
.pdrop>summary::-webkit-details-marker{display:none}
.pdrop>summary b{flex:1;text-align:right;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdrop>summary::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 2px 0 0;transition:transform .15s}
.pdrop[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.plist{max-height:260px;overflow-y:auto;border-top:1px solid var(--line);padding:4px 0}
.plist button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;padding:0 14px;border:0;background:none;color:var(--ink);font-weight:500;font-size:15px;text-align:left}
.plist button+button{border-top:1px solid var(--line)}
.plist button::after{content:"";flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);box-sizing:border-box}
.plist button.on{font-weight:700}
.prow .pn .plink{font-weight:600;text-decoration:underline dotted color-mix(in srgb,var(--muted) 70%,transparent);text-underline-offset:4px}
.plist button.on::after{background:var(--pitch);border-color:var(--pitch);box-shadow:inset 0 0 0 3px var(--surface)}

/* Navigation v2 */
.tabs .wrap{grid-template-columns:repeat(5,1fr)}
.tabs button{position:relative}
.tabs button.ping::after{content:"";position:absolute;top:7px;left:calc(50% + 13px);width:10px;height:10px;border-radius:50%;background:var(--a);box-shadow:0 0 0 2px var(--surface)}
.bopill{flex:none;font-family:var(--disp)!important;font-weight:700;font-size:15px!important;color:var(--gold)!important;border-color:color-mix(in srgb,var(--gold) 40%,transparent)!important;background:var(--gold-bg)!important}
@media (max-width:430px){.ginv span{display:none}.ginv{padding:7px 9px!important}.brandrow .brand{font-size:24px}.brbtns{gap:5px}}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:32px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary h2{margin:0}
details.fold>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 6px 4px 0;transition:transform .15s}
details.fold[open]>summary{margin-bottom:12px}

function tr(x,th){
  if(LANG!=='en'||x==null)return x;x=String(x);
  const m=x.match(/^(\s*)([\s\S]*?)(\s*)$/),c=m[2];if(!c)return x;
  let r=th&&th[c]!==undefined?th[c]:EN[c];
  if(r===undefined)for(const [re,rep] of ENRX){if(re.test(c)){r=c.replace(re,rep);break}}
  if(r===undefined)r=c;r=r.replace(/Équipe ([AB])(?![\wÀ-ÿ])/g,'Team $1');
  return r===c?x:m[1]+r+m[3];
}
const trLines=t=>LANG==='en'?String(t).split('\n').map(l=>tr(l)).join('\n'):t;
const TRD=new WeakMap();
function trText(n){
  if(TRD.get(n)===n.nodeValue)return;
  const p=n.parentElement;if(!p||p.closest('script,style,textarea,[data-notr]'))return;
  const v=tr(n.nodeValue,p.closest('.sth')?ENTH:p.closest('.res')?ENRES:null);if(v!==n.nodeValue)n.nodeValue=v;TRD.set(n,n.nodeValue);
}
function trAttrs(el){for(const a of ['aria-label','placeholder','title']){const v=el.getAttribute&&el.getAttribute(a);if(v){const t=tr(v);if(t!==v)el.setAttribute(a,t)}}}
function trTree(root){
  if(LANG!=='en'||!root)return;
  if(root.nodeType===3){trText(root);return}

async function hashPin(mid,pid,pin){
  const str=mid+':'+pid+':'+pin;
  try{if(crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return 'f'+(h>>>0).toString(16);
}

/* Stats */
function finished(){return S.matches.filter(x=>x.status==='voting'||x.status==='closed').sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.createdAt||0)-(b.createdAt||0))}
function rangeIdx(fin){const f=S.sf,n=fin.length;
  let fi=f.from?fin.findIndex(m=>m.date>=f.from):0;if(fi<0)fi=n-1;
  let ti=n-1;if(f.to){ti=-1;fin.forEach((m,i)=>{if(m.date<=f.to)ti=i})}if(ti<fi)ti=fi;
  return [fi,ti]}
function filteredMatches(){
  let ms=finished();const f=S.sf;
  if(f.mode==='last')ms=ms.slice(-f.n);
  else if(f.mode==='dates'&&ms.length>1){const [fi,ti]=rangeIdx(ms);ms=ms.slice(fi,ti+1)}
  return ms;
}
function teamRating(m,t,st){const ps=teamPlayers(m,t);if(!ps.length)return 6;return ps.reduce((a,p)=>a+(st[p]??baseOf(p)??6),0)/ps.length}
function computeOdds(teams,subs){
  const st={};computeStats().forEach(x=>{if(x.avg!=null)st[x.p]=x.avg});
  const m={teams,subs:subs||{A:[],B:[]}};const d=teamRating(m,'A',st)-teamRating(m,'B',st);
  const pA0=1/(1+Math.pow(10,-d/2)),pN=0.28-0.18*Math.abs(2*pA0-1),pA=pA0*(1-pN),pB=(1-pA0)*(1-pN);
  const c=p=>Math.max(1.05,Math.round(0.93/p*100)/100);return {A:c(pA),N:c(pN),B:c(pB)};
}
function oddsOf(m){return m.odds||computeOdds(m.teams,m.subs)}
const fmtOdd=n=>LANG==='en'?n.toFixed(2):n.toFixed(2).replace('.',',');
function pronosOf(mid){return (S.pronos||[]).filter(x=>x.matchId===mid&&x.pick&&x.stake>0)}
const BO_MAXBET=1000,BO_START=100,BO_MATCH=50,BO_WIN=50,BO_MVP=100,SHOP={gold:{cost:1000,days:7},crown:{cost:1500,days:7},stache:{cost:2000,days:7}};

async function podiumModal(mid){
  const m=S.matches.find(x=>x.id===mid);if(!m)return;toast(tr('Création du podium…'));
  const c=await drawPodium(m);if(!c){toast(tr('Pas encore de notes pour ce match.'));return}

  <button class="btn" id="pshare" style="background:#25D366">Partager</button><a class="btn ghost" id="pdl" href="${url}" download="${fn}" style="text-align:center;text-decoration:none">Télécharger</a><button class="btn ghost" id="pclose">Fermer</button>`);

function curveCard(x){
  const pts=x.log.map((l,i)=>({i,n:l.note,m:l.m})).filter(o=>o.n!=null);
  if(pts.length<2)return '';
  const W=320,H=150,L=26,Rr=8,T=10,B=24,n=x.log.length;
  const X=i=>L+(n<2?0:i/(n-1))*(W-L-Rr),Y=v=>T+(10-v)/10*(H-T-B);
  const avg=pts.reduce((a,o)=>a+o.n,0)/pts.length;
  const grid=[0,5,10].map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" class="cg"/><text x="${L-6}" y="${Y(v)+4}" class="ct" text-anchor="end">${v}</text>`).join('');
  const path=pts.map((o,j)=>(j?'L':'M')+X(o.i).toFixed(1)+' '+Y(o.n).toFixed(1)).join(' ');
  const dots=pts.map(o=>`<circle cx="${X(o.i).toFixed(1)}" cy="${Y(o.n).toFixed(1)}" r="3.5" class="cd"><title>${esc(fmtDate(o.m.date))} : ${fmt1(o.n)}</title></circle>`).join('');
  const f=pts[0].m,l=pts[pts.length-1].m;
  return `<div class="card"><h2>Évolution des notes</h2><svg class="curve" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution des notes">${grid}
  <line x1="${L}" x2="${W-Rr}" y1="${Y(avg)}" y2="${Y(avg)}" class="ca"/><path d="${path}" class="cl"/>${dots}
  <text x="${L}" y="${H-6}" class="ct">${esc(fmtDate(f.date))}</text><text x="${W-Rr}" y="${H-6}" class="ct" text-anchor="end">${esc(fmtDate(l.date))}</text></svg>
  <p class="small muted" style="margin:4px 0 0">Pointillés : moyenne ${fmt1(avg)}</p></div>`;
}
function h2hCard(ms,everyone){
  const h=S.h2h,opt=v=>`<option value="">—</option>`+everyone.map(x=>`<option value="${x.p}" ${v===x.p?'selected':''}>${esc(pname(x.p,x.last))}</option>`).join('');
  let body='<p class="small muted" style="margin:8px 0 0">Choisis deux joueurs.</p>';
  if(h.a&&h.b&&h.a!==h.b){
    const opp=[],mates=[];
    for(const m of ms){const ps=parts(m);if(!ps.includes(h.a)||!ps.includes(h.b))continue;(teamOf(m,h.a)===teamOf(m,h.b)?mates:opp).push(m)}
    const rec=(list,p)=>{let v=0,n=0,d=0;list.forEach(m=>{const r=resOf(m,p);r==='V'?v++:r==='N'?n++:d++});return {v,n,d}};
    const sumOf=(list,p,f)=>list.reduce((a,m)=>a+f(m,p),0);
    const gl=(m,p)=>goalsOf(m).filter(g=>g.scorer===p).length,as=(m,p)=>goalsOf(m).filter(g=>g.assist===p).length;
    const av=(list,p)=>{let s=0,c=0;list.forEach(m=>{const r=(m.results||{})[p];if(r){s+=r.sum;c+=r.count}});return c?s/c:null};
    const ra=rec(opp,h.a),na=pname(h.a),nb=pname(h.b);
    const row=(l,a,b)=>`<tr><td class="hl">${a}</td><th>${l}</th><td class="hl">${b}</td></tr>`;
    body=opp.length?`<table class="h2h"><thead><tr><td>${esc(na)}</td><th></th><td>${esc(nb)}</td></tr></thead><tbody>
      ${row('Victoires',ra.v,ra.d)}${row('Nuls',ra.n,ra.n)}${row('Buts',sumOf(opp,h.a,gl),sumOf(opp,h.b,gl))}${row('Passes D',sumOf(opp,h.a,as),sumOf(opp,h.b,as))}${row('Moyenne',fmt1(av(opp,h.a)),fmt1(av(opp,h.b)))}
      </tbody></table><p class="small muted" style="margin:6px 0 0">${opp.length} match${opp.length>1?'s':''} l’un contre l’autre.</p>`:'<p class="small muted" style="margin:8px 0 0">Jamais l’un contre l’autre.</p>';
    if(mates.length){const rm=rec(mates,h.a);body+=`<p class="small" style="margin:10px 0 0">Ensemble : <b>${rm.v}-${rm.n}-${rm.d}</b> (V-N-D) sur ${mates.length} match${mates.length>1?'s':''}.</p>`}
  }
  return `<div class="card"><h2>⚔️ Face à face</h2><div class="two"><select data-h2h="a" aria-label="Joueur 1">${opt(h.a)}</select><select data-h2h="b" aria-label="Joueur 2">${opt(h.b)}</select></div>${body}</div>`;
}

async function uploadPhoto(mid,file){
  if(!file)return;toast('Envoi de la photo…');

    const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});

    let w=img.width,h=img.height,max=1100;if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r)}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    let q=.72,data=c.toDataURL('image/jpeg',q);while(data.length>800000&&q>.3){q-=.1;data=c.toDataURL('image/jpeg',q)}

const norm=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function similar(a,b){a=norm(a);b=norm(b);if(!a||!b)return false;
  if(a.length>=3&&b.length>=3&&(a.startsWith(b)||b.startsWith(a)))return true;
  return lev(a,b)<=(Math.min(a.length,b.length)<=4?1:2)}
async function addPlayer(force){
  const inp=document.getElementById('newName');const name=(inp?inp.value:S.setup.newName).trim().replace(/\s+/g,' ');
  if(!name)return;
  const vis=p=>(p.uid||p.guest)&&!p.out;
  const reuse=async p=>{try{if(!vis(p))await db.doc('players/'+p.id).update(p.out?{guest:true,out:false}:{guest:true});S.setup.newName='';render();toast(`« ${p.name} » ajouté comme invité.`)}catch(e){toast(errMsg(e))}};
  const same=S.players.find(p=>norm(p.name)===norm(name));
  if(same){if(vis(same))toast(`« ${same.name} » existe déjà.`);else reuse(same);return}
  const near=force?[]:S.players.filter(p=>similar(p.name,name));
  if(near.length){
    openModal(`<h2>Doublon possible</h2><p style="margin-top:0">« ${esc(name)} » ressemble à :</p>
    ${near.map(p=>`<button class="btn" data-same="${p.id}">C’est ${esc(p.name)}</button>`).join('')}<button class="btn ghost" id="dyes">Nouveau joueur</button><button class="btn ghost" id="dcan">Annuler</button>`);
    $m.querySelectorAll('[data-same]').forEach(b=>b.onclick=()=>{closeModal();reuse(S.players.find(p=>p.id===b.dataset.same))});
    $m.querySelector('#dyes').onclick=()=>{closeModal();addPlayer(true)};
    $m.querySelector('#dcan').onclick=closeModal;
    return;
  }
  try{await db.collection('players').doc(rid('p')).set({name,createdAt:Date.now(),guest:true});S.setup.newName='';render();const n=document.getElementById('newName');if(n)n.focus()}
  catch(e){toast(errMsg(e))}
}

function balance(){

  const n=ten.length;if(n<2){toast(tr('Place au moins 2 joueurs dans les équipes.'));return}
  const st={};computeStats().forEach(x=>st[x.p]=x.avg);
  const r=p=>st[p]??baseOf(p)??6,h=Math.floor(n/2);
  let pick=0;
  if(n<=18){
    const tot=ten.reduce((t,p)=>t+r(p),0),best=[];
    // équipe de h joueurs : moyenne la plus proche de l'autre équipe
    for(let mask=0;mask<(1<<n);mask++){
      let c=0,sum=0;for(let i=0;i<n;i++)if(mask>>i&1){c++;sum+=r(ten[i])}
      if(c!==h||(n%2===0&&!(mask&1)))continue;
      best.push({mask,d:Math.abs(sum/h-(tot-sum)/(n-h))});
    }
    best.sort((x,y)=>x.d-y.d);const minD=best[0].d;
    const pool=best.filter(x=>x.d<=minD+0.06).slice(0,8);pick=pool[Math.floor(Math.random()*pool.length)].mask;
  }else{const o=ten.map((p,i)=>i).sort((x,y)=>r(ten[y])-r(ten[x]));let sA=0,sB=0,cA=0;o.forEach(i=>{if(cA<h&&(sA<=sB||n-h<=o.length-cA)){pick|=1<<i;sA+=r(ten[i]);cA++}else sB+=r(ten[i])})}
  ten.forEach((p,i)=>a[p]=(pick>>i&1)?'A':'B');
  const av=t=>{const l=ten.filter(p=>a[p]===t);return l.reduce((x,p)=>x+r(p),0)/l.length};const sa=av('A'),sb=av('B');
  render();toast(`Moyennes : A ${fmt1(sa)} / B ${fmt1(sb)}`);
}

async function closeVotes(){
  const m=cur();if(!m||m.status!=='voting')return;
  const ps=parts(m),res={};ps.forEach(p=>res[p]={sum:0,count:0});
  for(const v of votesOf(m.id)){if(!ps.includes(v.voter))continue;
    for(const [p,n] of Object.entries(v.ratings||{})){if(p===v.voter||!res[p])continue;const x=Number(n);if(x>=1&&x<=10){res[p].sum+=x;res[p].count++}}}
  let best=-1;ps.forEach(p=>{const r=res[p];if(r.count){const a=r.sum/r.count;if(a>best+1e-9)best=a}});
  const motm=best<0?[]:ps.filter(p=>res[p].count&&Math.abs(res[p].sum/res[p].count-best)<1e-9);
  try{await db.doc('matches/'+m.id).update({status:'closed',results:res,motm,closedAt:Date.now()})}
  catch(e){toast(errMsg(e))}
}

async function ensureMember(id,k,force){

  await Promise.race([raw.doc('groups/'+id+'/members/'+S.uid).set({k,joinedAt:Date.now()},{merge:true}),new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),15000))]);

}

    const gd=d.data(),e=myGroups().find(x=>x.id===g.id);
    if(e&&gd.k&&e.k!==gd.k)upsertGroup({...e,k:gd.k,mem:S.uid});
    S.gdoc=gd;if(e&&gd.name&&gd.name!==e.name){S.group.name=gd.name;upsertGroup({...e,name:gd.name})}
    syncAdm();migrateRoles();

  unsubs.push(db.doc('members/'+S.uid).onSnapshot(d=>{S.me=d.exists?d.data():null;
    syncAdm();migrateRoles();maybeAutoJoin();schedule()},e=>onErr(e,'membre')));
  unsubs.push(db.collection('players').onSnapshot(s=>{S.players=s.docs.map(d=>({id:d.id,...d.data()}));markReady('p');autoVoter();maybeAutoJoin();autoSeed();schedule()},e=>onErr(e,'players')));

  {let first=true;unsubs.push(db.collection('shop').onSnapshot(s=>{const old=new Set((S.shop||[]).map(x=>x.id));S.shop=s.docs.map(d=>({id:d.id,...d.data()}));S.fx=shopFx();

    first=false;schedule()},e=>onErr(e,'shop')))}
  unsubs.push(db.collection('votes').onSnapshot(s=>{S.votes=s.docs.map(d=>({id:d.id,...d.data()}));markReady('v');autoVoter();schedule()},e=>onErr(e,'votes')));
  unsubs.push(db.doc('meta/next').onSnapshot(d=>{S.next=d.exists?d.data():null;schedule()},e=>onErr(e,'next')));
  unsubs.push(db.doc('meta/state').onSnapshot(d=>{S.meta=d.exists?d.data():{};markReady('s');autoVoter();schedule()},e=>onErr(e,'state')));
  unsubs.push(db.doc('meta/config').onSnapshot(d=>{S.config=d.exists?d.data():{};refreshOrg();markReady('c');schedule()},e=>onErr(e,'config')));
}
function autoVoter(){

  if(S.voter&&S.voter.mid===m.id&&S.voter.pid===me)return;
  const ex=S.votes.find(v=>v.id===m.id+'__'+me);
  S.voter={mid:m.id,pid:me};S.voteMsg=null;S.draft={ratings:{...((ex&&ex.ratings)||{})},comments:{...((ex&&ex.comments)||{})}};
}

function seedRows(){
  const nn=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  const ps=S.players.filter(p=>!p.out).sort((a,b)=>a.name.localeCompare(b.name,'fr')),used=new Set();
  const ALIAS={'marco':'baro','romain':'justroms','thomas':'destru','manuel':'manu','moha hadji':'moha','naoufel':'nowfl','damjan':'shiftdamjan','tony':'tony_m','karim':'rimkovinho','galoul':'ilies'};
  const guess=n=>{const al=ALIAS[nn(n)];if(al){const pa=ps.find(x=>nn(x.name)===al&&!used.has(x.id));if(pa){used.add(pa.id);return pa.id}}const k=nn(n),f=k.split(/\s+/)[0];
    let p=ps.find(x=>nn(x.name)===k)||ps.find(x=>nn(x.name)===f)||ps.find(x=>nn(x.name).split(/\s+/)[0]===f)||ps.find(x=>lev(nn(x.name),k)<=1||lev(nn(x.name),f)<=1);
    return p&&!used.has(p.id)?(used.add(p.id),p.id):''};
  const rows=SEED_NOTES.map(([n,v])=>({n,v:Math.round(v*20)/10,p:guess(n)}));
  return {rows,ps};
}

function authErr(e){const c=(e&&e.code)||'';
  if(/email-already-in-use|credential-already-in-use/.test(c))return 'Cet email a déjà un compte. Utilise « J’ai déjà un compte ».';
  if(/invalid-email/.test(c))return 'Email invalide.';
  if(/weak-password/.test(c))return 'Mot de passe trop faible (6 caractères min.).';
  if(/wrong-password|invalid-credential|user-not-found|invalid-login/.test(c))return 'Pseudo/email ou mot de passe incorrect.';
  if(/too-many-requests/.test(c))return 'Trop d’essais. Réessaie plus tard.';
  if(/operation-not-allowed/.test(c))return 'Active « Adresse e-mail/Mot de passe » dans Firebase > Authentication.';
  if(/network/.test(c))return 'Erreur réseau. Réessaie.';
  return errMsg(e)}

document.getElementById('gpill').addEventListener('click',()=>{if(S.group)groupMenu()});
document.getElementById('gbo').addEventListener('click',()=>{if(S.group)shopModal()});
$b.addEventListener('click',e=>{if(e.target.closest('[data-tomatch]')){S.tab='match';S.playerView=null;S.backs=[];render();window.scrollTo(0,0)}});
(async()=>{
  if(!firebaseConfig.projectId||firebaseConfig.projectId.includes('REMPLACER')){S.noConf=true;render();return}
  let app;
  try{app=initializeApp(firebaseConfig);
    try{fs=initializeFirestore(app,{localCache:memoryLocalCache()})}catch(_){fs=getFirestore(app)}
  }catch(e){onErr(e);return}
  const wrapDoc=p=>({
    get:async()=>{const s=await getDoc(doc(fs,p));return {exists:s.exists(),data:()=>s.data()}},
    set:(x,o)=>o?setDoc(doc(fs,p),x,o):setDoc(doc(fs,p),x),update:x=>updateDoc(doc(fs,p),x),delete:()=>deleteDoc(doc(fs,p)),
    onSnapshot:(n,e)=>onSnapshot(doc(fs,p),s=>n({id:s.id,exists:s.exists(),data:()=>s.data()}),e)});
  raw={doc:wrapDoc,col:c=>({doc:id=>wrapDoc(c+'/'+id),get:()=>getDocs(collection(fs,c)),onSnapshot:(n,e)=>onSnapshot(collection(fs,c),n,e)})};
  const app0=app;
  await new Promise(res=>{auth=getAuth(app0);let done=false;
    onAuthStateChanged(auth,u=>{if(u){S.uid=u.uid;S.anon=u.isAnonymous;S.pseudo=u.displayName||'';S.email=u.email||'';S.authErr='';if(!done){done=true;res()}else schedule()}
      else signInAnonymously(auth).catch(e=>{console.error(e);const c=e&&e.code||'';S.authErr=/operation-not-allowed|admin-restricted|configuration-not-found/.test(c)?'Active la connexion anonyme : Firebase > Authentication > Sign-in method > Anonyme.':(/unauthorized-domain/.test(c)?'Ajoute ce domaine dans Firebase > Authentication > Paramètres > Domaines autorisés.':'Erreur de connexion ('+c+'). Vérifie le réseau.');render()})})});
  render();
  // ancienne version (données à la racine) : proposer l'import une seule fois
  Promise.all([raw.col('matches').get(),raw.doc('meta/legacy').get()]).then(([m,l])=>{S.legacy=!m.empty&&!l.exists}).catch(()=>{});
  // lien d'invitation #g=...&k=...
  const hp=new URLSearchParams(location.hash.slice(1));
  if(hp.get('g')&&hp.get('k')){
    const id=slugify(hp.get('g')),k=hp.get('k');
    try{history.replaceState(null,'',location.pathname+location.search)}catch(_){}
    try{await ensureMember(id,k,true);const d=await raw.doc('groups/'+id).get();const name=(d.exists&&d.data().name)||id;
      upsertGroup({...(myGroups().find(x=>x.id===id)||{}),name});connect({id,name});toast('Bienvenue dans '+name+'.');return}
    catch(e){toast(e&&e.code==='permission-denied'?'Lien invalide ou expiré.':errMsg(e))}
  }
  const l=myGroups(),c=l.find(x=>x.id===LS.get(GC))||l[0];
  connect(c?{id:c.id,name:c.name}:null);
})();
render();
</script>
</body>
</html>
