<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foot à 5 – Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8F5EA;--surface:#FFFFFF;--ink:#0B1E12;--muted:#4A6553;--line:#C7E0CD;
  --pitch:#0E8A43;--pitch-ink:#FFFFFF;--a:#FF5A1F;--b:#1E6BFF;--gold:#D99A00;--gold-bg:#FFF4CC;--danger:#D62828;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#06140B;--surface:#0E2216;--ink:#E9F7EC;--muted:#8DB39A;--line:#1E3D29;
    --pitch:#19B25A;--pitch-ink:#FFFFFF;--a:#FF6B35;--b:#4D8BFF;--gold:#FFC93C;--gold-bg:#2B230A;--danger:#FF6B6B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#06140B;--surface:#0E2216;--ink:#E9F7EC;--muted:#8DB39A;--line:#1E3D29;
  --pitch:#19B25A;--pitch-ink:#FFFFFF;--a:#FF6B35;--b:#4D8BFF;--gold:#FFC93C;--gold-bg:#2B230A;--danger:#FF6B6B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:transparent;color:var(--ink);font:16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0A7A39}
.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}

/* Tableau d'affichage */
.top{color:#fff;padding:12px 16px 20px;text-shadow:0 1px 2px rgba(0,0,0,.35);border-bottom:4px solid #fff;
  background-color:#0A7A39;
  background-image:
    radial-gradient(circle at 50% 50%,transparent 58px,rgba(255,255,255,.4) 59px,rgba(255,255,255,.4) 61px,transparent 62px),
    linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.4) calc(50% - 1px),rgba(255,255,255,.4) calc(50% + 1px),transparent calc(50% + 1px)),
    repeating-linear-gradient(90deg,#0A7A39 0 44px,#0F9446 44px 88px)}
.wrap{max-width:560px;margin:0 auto}
.brand{font:600 15px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.02em;opacity:.85}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:10px}
.board .tn{font:600 20px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;overflow-wrap:anywhere}
.board .tn.r{text-align:right}
.board .tn::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:1px}
.board .tn.A::before{background:var(--a)}
.board .tn.B::before{background:var(--b)}
.board .sc{font:700 46px/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums;background:#07140C;color:#FFE14D;text-shadow:0 0 12px rgba(255,225,77,.45);box-shadow:inset 0 0 0 2px rgba(255,255,255,.15);padding:4px 14px 6px;border-radius:6px;min-width:120px;text-align:center}
.board-sub{text-align:center;font-size:14px;margin-top:8px;opacity:.9}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{display:flex;align-items:center;gap:8px;padding:14px 12px;border:1px solid var(--line);background:var(--bg);border-radius:8px;font:600 19px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;text-align:left;overflow-wrap:anywhere}
.pick button .ck{margin-left:auto;color:var(--pitch)}
.goals{list-style:none;margin:0 0 12px;padding:0}
.goals li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.goals li:first-child{border-top:0}
.goals li .g{flex:1;min-width:0;overflow-wrap:anywhere}
.gtally{font:700 30px/1 "Barlow Condensed","Arial Narrow",sans-serif;text-align:center;margin-bottom:10px;font-variant-numeric:tabular-nums}
.gseg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.gseg .dot{width:14px;height:14px}
.gseg button{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:20px 10px;font:700 24px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;display:flex;align-items:center;justify-content:center;gap:6px;overflow-wrap:anywhere}
.gseg button.on.A{background:var(--a);border-color:var(--a);color:#fff}
.gseg button.on.B{background:var(--b);border-color:var(--b);color:#fff}
.gpick button{justify-content:center;text-align:center;font-size:17px;padding:12px 8px}
.gpick button.on{background:var(--pitch);border-color:var(--pitch);color:#fff}
.clockbig{font:700 64px/1 "Barlow Condensed","Arial Narrow",sans-serif;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0 12px}
.clockbig.run{color:var(--pitch)}
.chrono .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chrono .btn{margin:0}
.bchip{display:inline-block;background:#07140C;color:#FFE14D;font:700 18px/1 "Barlow Condensed","Arial Narrow",sans-serif;padding:5px 10px;border-radius:999px;font-variant-numeric:tabular-nums;text-shadow:none}
.bchip.run::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#FF3B3B;margin-right:6px;vertical-align:1px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.bgs{position:fixed;inset:0;z-index:-2;overflow:hidden;background:var(--bg)}
.bgs div{position:absolute;inset:0;background-size:cover;background-position:center 25%;opacity:0;transition:opacity 1.6s ease}
.bgs div.on{opacity:1}
.bgs::after{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 72%,transparent)}
.empty{background:color-mix(in srgb,var(--surface) 85%,transparent);border-radius:10px}
.board-empty{font:600 26px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin-top:10px}

main{padding:14px 12px calc(84px + env(safe-area-inset-bottom,0px))}
h2{font:600 21px/1.2 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 12px;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:14px}
.empty{text-align:center;padding:40px 12px;color:var(--muted)}
.btn{box-shadow:0 2px 0 rgba(0,0,0,.18);display:block;width:100%;font:700 19px/1 "Barlow Condensed","Arial Narrow",sans-serif;padding:14px 16px;border-radius:8px;border:0;background:var(--pitch);color:var(--pitch-ink);margin-bottom:10px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.inline{display:inline-block;width:auto;padding:11px 16px;margin:0}
.link{background:none;border:0;padding:0;color:var(--b);text-decoration:underline}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
label.fld{display:block;font-size:14px;color:var(--muted);margin-bottom:10px}
label.fld input,label.fld select{margin-top:4px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addrow{display:flex;gap:8px;margin-bottom:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.dot.A{background:var(--a)}.dot.B{background:var(--b)}

/* Composition */
.counts{display:flex;gap:16px;font-size:14px;margin-bottom:8px;flex-wrap:wrap}
.counts b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:17px}
.counts .ok{color:var(--pitch)}
.prow{display:flex;align-items:center;gap:6px;padding:7px 0;border-top:1px solid var(--line)}
.prow .pn{flex:1;min-width:0;overflow-wrap:anywhere}
.seg4{display:flex;gap:3px}
.seg4 button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 7px;font:600 14px/1 "Barlow Condensed","Arial Narrow",sans-serif;min-width:30px}
.seg4 button.on.A,.seg4 button.on.sA{background:var(--a);border-color:var(--a);color:#fff}
.seg4 button.on.B,.seg4 button.on.sB{background:var(--b);border-color:var(--b);color:#fff}
.x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:4px 6px}
.lineup{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lineup h3{font:600 17px/1.2 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 6px;display:flex;align-items:center;gap:6px}
.lineup ul{list-style:none;margin:0;padding:0}
.lineup li{padding:3px 0;font-size:15px;overflow-wrap:anywhere}
.lineup li.sub{color:var(--muted)}
.lineup .ck{color:var(--pitch);font-weight:600}

/* Score + vainqueur */
.scorein{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end;margin-bottom:12px}
.scorein input{font:700 30px/1 "Barlow Condensed","Arial Narrow",sans-serif;text-align:center;padding:8px}
.scorein span{font:700 28px/1 "Barlow Condensed","Arial Narrow",sans-serif;padding-bottom:12px}
.seg{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 8px;font-weight:600;overflow-wrap:anywhere}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sorts{display:flex;gap:6px;margin-bottom:10px}
.sorts button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 6px;font-weight:600;font-size:15px}
.sorts button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Vote */
.who{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rrow .rhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rrow .rhead .nm{flex:1;font-weight:600}
.rrow .val{font:700 26px/1 "Barlow Condensed","Arial Narrow",sans-serif;min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
.rates{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-bottom:8px}
.rates button{height:38px;padding:0;border:1px solid var(--line);background:var(--bg);border-radius:6px;font:600 17px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.rates button.on{background:var(--pitch);border-color:var(--pitch);color:#fff}
.rates button.lit{background:color-mix(in srgb,var(--pitch) 18%,var(--bg))}
.cmt{font-size:15px;padding:8px 10px}
.savebar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));padding-top:6px;background:linear-gradient(transparent,var(--bg) 30%)}
.msg{font-size:15px;margin:0 0 10px;min-height:1px}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--pitch)}

/* Résultats */
.result{text-align:center}
.result .wl{font:600 22px/1.2 "Barlow Condensed","Arial Narrow",sans-serif;margin-bottom:8px}
.result .sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.result .sb .tn{font:600 18px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px;justify-content:center}
.result .sb .tn.win{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.result .score{font:700 52px/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
.motm{background:var(--gold-bg);border:2px solid var(--gold);text-align:center}
.motm .k{font-size:14px;color:var(--gold);font-weight:600}
.motm .n{font:700 34px/1.05 "Barlow Condensed","Arial Narrow",sans-serif;margin:4px 0;overflow-wrap:anywhere}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:28px 12px 1fr auto auto;gap:8px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rank .pos{font:700 20px/1.2 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--muted)}
.rank .dot{margin-top:6px}
.rank .nm{overflow-wrap:anywhere}
.rank .nm small{color:var(--muted)}
.rank .cm{display:block;font-size:13px;color:var(--muted);font-style:italic;margin-top:2px}
.rank .avg{font:700 22px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
.rank .nv{font-size:13px;color:var(--muted);padding-top:4px;min-width:42px;text-align:right}
.rank li.is-motm .pos,.rank li.is-motm .avg{color:var(--gold)}

/* Stats */
.tbl{overflow-x:auto;margin:0 -12px;padding:0 12px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:8px 5px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{font:600 14px/1.2 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--muted);border-top:0}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:90px}
th .sth{background:none;border:0;padding:4px 2px;font:inherit;color:inherit;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
th .sth.on{color:var(--pitch)}
th .sth .ar{font-size:11px;opacity:.7}
th .sth.on .ar{opacity:1}
td.hl{color:var(--pitch)}
td.hl{font-weight:600}

/* Historique */
.hitem{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;display:block}
.hitem .d{font-size:13px;color:var(--muted)}
.hitem .l{display:flex;align-items:center;gap:8px;font:600 19px/1.2 "Barlow Condensed","Arial Narrow",sans-serif;margin:4px 0;flex-wrap:wrap}
.hitem .l .w{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.hitem .s{font-variant-numeric:tabular-nums}
.hitem .ps{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.hitem .m{font-size:14px;margin-top:4px}
.hitem .m b{color:var(--gold)}
.hdetail{margin:-4px 0 14px 10px;padding-left:10px;border-left:3px solid var(--line)}

/* Navigation */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{background:none;border:0;border-top:3px solid transparent;padding:12px 0 14px;font:600 17px/1 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--muted)}
.tabs button.on{color:var(--pitch);border-top-color:var(--pitch)}

/* Fenêtre */
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal[hidden]{display:none}
.mbox{background:var(--surface);color:var(--ink);border-radius:12px;padding:18px 16px 8px;width:100%;max-width:520px;max-height:calc(100% - 24px);overflow:auto;margin-bottom:env(safe-area-inset-bottom,0px)}
.pins{list-style:none;margin:0 0 12px;padding:0}
.pins li{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);gap:10px}
.pins .pin{font:700 26px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;font-size:15px;max-width:90%}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.mbox{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:0}}}
</style>
</head>

/* Résultats */
function rows(m){
  const res=m.results||{};
  const rs=parts(m).map(p=>{const r=res[p]||{sum:0,count:0};return {p,count:r.count,avg:r.count?r.sum/r.count:null}});
  rs.sort((x,y)=>(y.avg??-1)-(x.avg??-1)||y.count-x.count);
  rs.forEach(r=>r.rank=r.avg==null?'–':1+rs.filter(o=>o.avg!=null&&o.avg>r.avg).length);
  return rs;
}
function resultCard(m){
  const wl=m.winner==='N'?'Match nul':esc(tname(m,m.winner))+' gagne';
  const gs=goalsOf(m);
  const gl=gs.length?`<ul class="goals" style="text-align:left;margin:12px 0 0">${gs.map(g=>`<li><span class="dot ${g.team}"></span><span class="g">${goalLine(m,g)}</span></li>`).join('')}</ul>`:'';
  return `<div class="card result"><div class="wl">${wl}</div><div class="sb"><div class="tn ${m.winner==='A'?'win':''}"><span class="dot A"></span>${esc(tname(m,'A'))}</div><div class="score">${m.score.A} – ${m.score.B}</div><div class="tn ${m.winner==='B'?'win':''}"><span class="dot B"></span>${esc(tname(m,'B'))}</div></div><div class="small muted" style="margin-top:6px">${esc(fmtDate(m.date))}</div>${gl}</div>`;
}
function motmCard(m){
  const mo=m.motm||[];
  if(!mo.length)return '<div class="card motm"><div class="k">Homme du match</div><p class="muted" style="margin:6px 0 0">Aucun vote : pas de MOTM.</p></div>';
  const r=(m.results||{})[mo[0]];
  return `<div class="card motm"><div class="k">Homme du match${mo.length>1?' (ex æquo)':''}</div><div class="n">${mo.map(p=>esc(pname(p,m))).join(' & ')}</div><div class="small">${fmt1(r.sum/r.count)}/10 sur ${r.count} vote${r.count>1?'s':''}</div></div>`;
}
function rankCard(m){
  const vs=votesOf(m.id),mo=m.motm||[];
  const li=r=>{const cm=vs.map(v=>v.comments&&v.comments[r.p]).filter(Boolean);
    return `<li class="${mo.includes(r.p)?'is-motm':''}"><span class="pos">${r.rank}</span><span class="dot ${teamOf(m,r.p)}"></span><span class="nm">${esc(pname(r.p,m))}${isSub(m,r.p)?' <small>remp.</small>':''}${cm.length?`<span class="cm">${cm.map(c=>'« '+esc(c)+' »').join('<br>')}</span>`:''}</span><span class="avg">${fmt1(r.avg)}</span><span class="nv">${r.count} vote${r.count>1?'s':''}</span></li>`};
  return `<div class="card"><h2>Classement</h2><ol class="rank">${rows(m).map(li).join('')}</ol></div>`;
}

/* Stats */
function computeStats(){
  const st={};
  for(const m of S.matches.filter(x=>x.status==='voting'||x.status==='closed')){
    for(const p of parts(m)){
      const s=st[p]||(st[p]={p,mj:0,v:0,n:0,d:0,sum:0,cnt:0,motm:0,g:0,pd:0,last:m});
      s.mj++;const t=teamOf(m,p);
      if(m.winner==='N')s.n++;else if(m.winner===t)s.v++;else s.d++;
      const r=(m.results||{})[p];if(r){s.sum+=r.sum;s.cnt+=r.count}
      if((m.motm||[]).includes(p))s.motm++;
    }
    for(const g of goalsOf(m)){if(st[g.scorer])st[g.scorer].g++;if(g.assist&&st[g.assist])st[g.assist].pd++}
  }
  return Object.values(st).map(s=>({...s,wr:s.mj?s.v/s.mj*100:0,avg:s.cnt?s.sum/s.cnt:null}));
}
function vStats(){
  const all=computeStats();
  const reset='<button class="btn danger" data-act="reset" style="margin-top:24px">🔒 Réinitialisation complète</button>';
  if(!all.length)return '<div class="empty"><p>Aucun match clôturé.</p></div>'+reset;
  const {k,dir}=S.statSort;
  const cols=[['name','Joueur'],['mj','MJ'],['v','V'],['n','N'],['d','D'],['wr','%V'],['avg','Moy.'],['motm','MOTM'],['g','Buts'],['pd','PD']];
  const val=(x,c)=>c==='name'?pname(x.p,x.last):(x[c]??-1);
  all.sort((a,b)=>{const A=val(a,k),B=val(b,k);const c=k==='name'?String(A).localeCompare(String(B),'fr'):A-B;return c*dir||b.mj-a.mj||String(val(a,'name')).localeCompare(String(val(b,'name')),'fr')});
  const top=(key,title,unit)=>{const l=all.filter(x=>x[key]>0).sort((a,b)=>b[key]-a[key]||(key==='g'?b.pd-a.pd:b.g-a.g)).slice(0,5);
    return `<div class="card"><h2>${title}</h2>${l.length?`<ol class="rank">${l.map(x=>`<li style="grid-template-columns:28px 1fr auto"><span class="pos">${1+l.filter(o=>o[key]>x[key]).length}</span><span class="nm">${esc(pname(x.p,x.last))}</span><span class="avg">${x[key]} <small class="muted" style="font-size:14px">${unit}</small></span></li>`).join('')}</ol>`:'<p class="small muted" style="margin:0">Aucun pour l’instant.</p>'}</div>`};
  const th=([c,l])=>`<th><button class="sth ${k===c?'on':''}" data-sk="${c}" aria-sort="${k===c?(dir<0?'descending':'ascending'):'none'}">${l}<span class="ar">${k===c?(dir<0?'▼':'▲'):'↕'}</span></button></th>`;
  const td=(x,c,v)=>`<td class="${k===c?'hl':''}">${v}</td>`;
  return top('g','⚽ Meilleurs buteurs','buts')+top('pd','🅰️ Meilleurs passeurs','PD')+`
  <div class="card"><h2>Classement</h2><p class="small muted" style="margin:-4px 0 8px">Touche une colonne pour trier. Retouche pour inverser.</p><div class="tbl"><table><thead><tr>${cols.map(th).join('')}</tr></thead><tbody>
  ${all.map(x=>`<tr>${td(x,'name',esc(pname(x.p,x.last)))}${td(x,'mj',x.mj)}${td(x,'v',x.v)}${td(x,'n',x.n)}${td(x,'d',x.d)}${td(x,'wr',Math.round(x.wr))}${td(x,'avg',fmt1(x.avg))}${td(x,'motm',x.motm)}${td(x,'g',x.g)}${td(x,'pd',x.pd)}</tr>`).join('')}
  </tbody></table></div><p class="small muted" style="margin:10px 0 0">MJ matchs joués, V victoires, N nuls, D défaites, PD passes décisives.</p></div>${reset}`;
}

const norm=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function similar(a,b){a=norm(a);b=norm(b);if(!a||!b)return false;
  if(a.length>=3&&b.length>=3&&(a.startsWith(b)||b.startsWith(a)))return true;
  return lev(a,b)<=(Math.min(a.length,b.length)<=4?1:2)}
async function addPlayer(force){
  const inp=document.getElementById('newName');const name=(inp?inp.value:S.setup.newName).trim().replace(/\s+/g,' ');
  if(!name)return;
  const same=S.players.find(p=>norm(p.name)===norm(name));
  if(same){toast(`« ${same.name} » existe déjà.`);return}
  const near=force?[]:S.players.filter(p=>similar(p.name,name));
  if(near.length){
    openModal(`<h2>Doublon possible</h2><p style="margin-top:0">« ${esc(name)} » ressemble à : <b>${near.map(p=>esc(p.name)).join(', ')}</b>.</p>
    <button class="btn" id="dno">C’est le même, ne pas ajouter</button><button class="btn ghost" id="dyes">Ajouter quand même</button>`);
    $m.querySelector('#dno').onclick=()=>{closeModal();S.setup.newName='';render()};
    $m.querySelector('#dyes').onclick=()=>{closeModal();addPlayer(true)};
    return;
  }
  try{await db.collection('players').doc(rid('p')).set({name,createdAt:Date.now()});S.setup.newName='';render();const n=document.getElementById('newName');if(n)n.focus()}
  catch(e){toast(errMsg(e))}
}

function lastTeams(){
  const m=closedMatches()[0];if(!m)return;const a={};
  m.teams.A.forEach(p=>a[p]='A');m.teams.B.forEach(p=>a[p]='B');(m.subs.A||[]).forEach(p=>a[p]='sA');(m.subs.B||[]).forEach(p=>a[p]='sB');

function balance(){
  const a=S.setup.assign,ten=Object.keys(a).filter(p=>(a[p]==='A'||a[p]==='B')&&S.players.some(x=>x.id===p));
  if(ten.length!==10)return;
  const st={};computeStats().forEach(x=>st[x.p]=x.avg);
  const r=p=>st[p]??6;
  const tot=ten.reduce((t,p)=>t+r(p),0);let best=[];
  for(let mask=0;mask<1024;mask++){
    let c=0,sum=0;for(let i=0;i<10;i++)if(mask>>i&1){c++;sum+=r(ten[i])}
    if(c!==5||!(mask&1))continue;
    best.push({mask,d:Math.abs(tot-2*sum)});
  }
  best.sort((x,y)=>x.d-y.d);const minD=best[0].d;
  const pool=best.filter(x=>x.d<=minD+0.3).slice(0,8);
  const pick=pool[Math.floor(Math.random()*pool.length)].mask;
  ten.forEach((p,i)=>a[p]=(pick>>i&1)?'A':'B');
  const sa=ten.filter(p=>a[p]==='A').reduce((t,p)=>t+r(p),0)/5,sb=ten.filter(p=>a[p]==='B').reduce((t,p)=>t+r(p),0)/5;
  render();toast(`Moyennes : A ${fmt1(sa)} / B ${fmt1(sb)}`);
}

async function closeVotes(){
  const m=cur();if(!m||m.status!=='voting')return;
  const ps=parts(m),res={};ps.forEach(p=>res[p]={sum:0,count:0});
  for(const v of votesOf(m.id)){if(!ps.includes(v.voter))continue;
    for(const [p,n] of Object.entries(v.ratings||{})){if(p===v.voter||!res[p])continue;const x=Number(n);if(x>=1&&x<=10){res[p].sum+=x;res[p].count++}}}
  let best=-1;ps.forEach(p=>{const r=res[p];if(r.count){const a=r.sum/r.count;if(a>best+1e-9)best=a}});
  const motm=best<0?[]:ps.filter(p=>res[p].count&&Math.abs(res[p].sum/res[p].count-best)<1e-9);
  try{await db.doc('matches/'+m.id).update({status:'closed',results:res,motm,closedAt:Date.now()})}
  catch(e){toast(errMsg(e))}
}

  const ratings={},comments={};

  else if(act==='logout'){S.voter=null;S.draft=null;S.voteMsg=null;render()}
  else if(act==='saveVote'){b.disabled=true;saveVote().finally(()=>{const x=$v.querySelector('[data-act="saveVote"]');if(x)x.disabled=false})}
  else if(act==='orgOut'){LS.del('foot5_org');refreshOrg();render()}
  else if(act==='orgIn')orgLogin();
  else if(act==='reset')adminGate(()=>confirmBox('Effacer tous les joueurs, matchs, votes et statistiques ? Action irréversible.','Tout effacer',resetAll,'EFFACER'));
  else if(act==='delMatch'){const id=b.dataset.m,m=S.matches.find(x=>x.id===id);
    adminGate(()=>confirmBox(`Supprimer le match du ${esc(fmtDate(m?m.date:''))} ? Ses buts, votes et stats seront effacés.`,'Supprimer',()=>deleteMatch(id)))}
  else if(act==='adminOut'){LS.del('foot5_org');render();toast('Mode admin déconnecté.')}
});
$v.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='newName'){S.setup.newName=t.value;return}
  if(t.dataset.s){S.setup[t.dataset.s]=t.value;return}
  if(t.dataset.c&&S.draft){S.draft.comments[t.dataset.c]=t.value;return}
  if(t.dataset.f){S.closeForm[t.dataset.f]=t.value;S.closeForm.manual=true;
    const a=parseInt(S.closeForm.sA,10),b=parseInt(S.closeForm.sB,10);
    if(a>=0&&b>=0){S.closeForm.winner=a>b?'A':b>a?'B':'N';document.querySelectorAll('#wseg button').forEach(x=>x.classList.toggle('on',x.dataset.w===S.closeForm.winner))}}
});
$v.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset.gf)return;
  S.goalForm[t.dataset.gf]=t.value;
  if(t.dataset.gf==='scorer'){if(S.goalForm.assist===t.value)S.goalForm.assist='';t.blur();render()}
});
$v.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='newName'){e.preventDefault();addPlayer(false)}
});

/* ---------- Données (Firestore) ---------- */
function markReady(k){S.got[k]=1;if(!S.ready&&S.got.p&&S.got.m&&S.got.v&&S.got.s&&S.got.c)S.ready=true}
function onErr(e){console.error(e);S.noDb=true;render()}
(()=>{
  if(!firebaseConfig.projectId||firebaseConfig.projectId.includes('REMPLACER')){S.noConf=true;render();return}
  let fs;
  try{const app=initializeApp(firebaseConfig);
    try{fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(_){fs=getFirestore(app)}
  }catch(e){onErr(e);return}
  const wrapDoc=p=>({
    set:x=>setDoc(doc(fs,p),x),update:x=>updateDoc(doc(fs,p),x),delete:()=>deleteDoc(doc(fs,p)),
    onSnapshot:(n,e)=>onSnapshot(doc(fs,p),s=>n({id:s.id,exists:s.exists(),data:()=>s.data()}),e)});
  db={doc:wrapDoc,collection:c=>({doc:id=>wrapDoc(c+'/'+id),get:()=>getDocs(collection(fs,c)),onSnapshot:(n,e)=>onSnapshot(collection(fs,c),n,e)})};
  db.collection('players').onSnapshot(s=>{S.players=s.docs.map(d=>({id:d.id,...d.data()}));markReady('p');schedule()},onErr);
  db.collection('matches').onSnapshot(s=>{S.matches=s.docs.map(d=>({id:d.id,...d.data()}));markReady('m');
    const m=cur();if(S.voter&&(!m||m.id!==S.voter.mid||m.status!=='voting')){S.voter=null;S.draft=null}
    schedule()},onErr);
  db.collection('votes').onSnapshot(s=>{S.votes=s.docs.map(d=>({id:d.id,...d.data()}));markReady('v');schedule()},onErr);
  db.doc('meta/state').onSnapshot(d=>{S.meta=d.exists?d.data():{};markReady('s');schedule()},onErr);
  db.doc('meta/config').onSnapshot(d=>{S.config=d.exists?d.data():{};refreshOrg();markReady('c');schedule()},onErr);
})();
render();
</script>
